stages:
  - build

build:
  stage: build
  variables:
    MAVEN_OPTS: >-
      -Dhttps.protocols=TLSv1.2
      -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
      -Dorg.slf4j.simpleLogger.showDateTime=true
      -Djava.awt.headless=true
    JAVA_HOME: /srv/jdk8u492-b09
  script:
    - echo $JAVA_HOME
    - mvn -V -B clean package
    - VERSION=$(mvn -B help:evaluate -Dexpression=project.version -q -DforceStdout)
    - TO_IMAGE=$(mvn -B help:evaluate -Dexpression=to.image -q -DforceStdout)
    - |
      echo "Version: $VERSION, ToImage: $TO_IMAGE"
    # Build amd64+arm64 (dragonwell base) → temporary tags
    - mvn -V -B compile jib:build -Dto.tag.suffix=-tmp-a64 -Dto.auth.username=$JIB_TO_AUTH_USERNAME -Dto.auth.password=$JIB_TO_AUTH_PASSWORD -DCI_PIPELINE_IID=$CI_PIPELINE_IID
    # Build loong64 (loong64 JDK base) → temporary tags
    - mvn -V -B compile jib:build -P loong64 -Dto.tag.suffix=-loong64 -Dto.auth.username=$JIB_TO_AUTH_USERNAME -Dto.auth.password=$JIB_TO_AUTH_PASSWORD -DCI_PIPELINE_IID=$CI_PIPELINE_IID
    # Merge into multi-arch manifest list with crane (handles manifest list sources)
    - curl -sL "https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz" | tar xz crane
    - chmod +x crane
    - ./crane auth login registry.cn-qingdao.aliyuncs.com -u $JIB_TO_AUTH_USERNAME -p $JIB_TO_AUTH_PASSWORD
    - ./crane index append -t $TO_IMAGE:$VERSION -b $TO_IMAGE:$VERSION-tmp-a64 $TO_IMAGE:$VERSION-loong64
    - ./crane index append -t $TO_IMAGE:$VERSION-$CI_PIPELINE_IID -b $TO_IMAGE:$VERSION-$CI_PIPELINE_IID-tmp-a64 $TO_IMAGE:$VERSION-$CI_PIPELINE_IID-loong64
  cache:
    key: "${CI_JOB_NAME}-${CI_COMMIT_BRANCH}"
    paths:
      - .m2/repository
  tags:
    - shell
